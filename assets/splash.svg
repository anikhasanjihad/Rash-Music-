<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="music" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#48B6FF"/>
      <stop offset="100%" stop-color="#8955F6"/>
    </linearGradient>
    <linearGradient id="musicText" gradientUnits="userSpaceOnUse" x1="590" y1="90" x2="900" y2="190">
      <stop offset="0%" stop-color="#48B6FF"/>
      <stop offset="100%" stop-color="#8955F6"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.2" r="0.75">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8955F6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8955F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14122B"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <style>
      .bg{fill:#07070C}
      .glow{transform-origin:150px 150px;animation:glow 3.2s ease-in-out .6s infinite alternate}
      .orb{transform-origin:150px 150px;animation:orb .9s cubic-bezier(.2,.9,.25,1.15) both}
      .w{stroke-dasharray:170;stroke-dashoffset:170;animation:draw .55s cubic-bezier(.4,0,.2,1) forwards}
      .w1{animation-delay:.55s}.w2{animation-delay:.7s}.w3{animation-delay:.85s}
      .t1{animation:slide .7s cubic-bezier(.2,.8,.2,1) 1s both}
      .t2{animation:slide .7s cubic-bezier(.2,.8,.2,1) 1.15s both}
      @keyframes orb{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
      @keyframes draw{to{stroke-dashoffset:0}}
      @keyframes slide{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:translateX(0)}}
      @keyframes glow{from{opacity:.45;transform:scale(.96)}to{opacity:.9;transform:scale(1.06)}}
    </style>
  </defs>
  <rect class="bg" width="1000" height="300"/>
  <circle class="glow" cx="150" cy="150" r="150" fill="url(#glow)"/>
  <g class="orb">
    <circle cx="150" cy="150" r="125" fill="url(#music)"/>
    <circle cx="150" cy="150" r="125" fill="url(#sheen)"/>
    <circle cx="150" cy="150" r="123" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
  </g>
  <g fill="none" stroke="url(#wave)" stroke-width="17" stroke-linecap="round">
    <path class="w w1" d="M75 112 Q150 80 225 112"/>
    <path class="w w2" d="M85 150 Q150 125 215 150"/>
    <path class="w w3" d="M98 187 Q150 169 202 187"/>
  </g>
  <text class="t1" x="320" y="180" font-family="Arial, sans-serif" font-size="105" font-weight="700" fill="#FFFFFF">Rash</text>
  <text class="t2" x="590" y="180" font-family="Arial, sans-serif" font-size="105" font-weight="700" fill="url(#musicText)">Music</text>
</svg>
