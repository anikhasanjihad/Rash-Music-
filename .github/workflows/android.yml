name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup local.properties (optional keys)
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
      run: |
        : > local.properties
        [ -n "$LASTFM_API_KEY" ] && echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> local.properties
        [ -n "$LASTFM_SECRET" ] && echo "LASTFM_SECRET=$LASTFM_SECRET" >> local.properties
        [ -n "$LISTEN_TOGETHER_SERVER" ] && echo "LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER" >> local.properties
        true

    - name: Setup signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > rashmusic-release.jks
        else
          echo "::warning::KEYSTORE_BASE64 secret not set - signing with a temporary key. Updates over a previous install will NOT work until the secrets are added."
          KEYSTORE_PASSWORD=temporary-pass; KEY_ALIAS=rashmusic; KEY_PASSWORD=temporary-pass
          keytool -genkeypair -v -keystore rashmusic-release.jks -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Rash Music, O=AHR"
        fi
        {
          echo "storeFile=rashmusic-release.jks"
          echo "storePassword=$KEYSTORE_PASSWORD"
          echo "keyAlias=$KEY_ALIAS"
          echo "keyPassword=$KEY_PASSWORD"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Collect APKs
      id: apks
      run: |
        VER=$(grep 'rashmusicVersionName' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
        echo "version=$VER" >> "$GITHUB_OUTPUT"
        mkdir -p out
        for f in app/build/outputs/apk/prod/release/*.apk; do
          case "$f" in
            *universal*) cp "$f" "out/RashMusic-v${VER}.apk" ;;
            *arm64-v8a*) cp "$f" "out/RashMusic-v${VER}_arm64-v8a.apk" ;;
            *armeabi-v7a*) cp "$f" "out/RashMusic-v${VER}_armeabi-v7a.apk" ;;
            *x86_64*) cp "$f" "out/RashMusic-v${VER}_x86_64.apk" ;;
          esac
        done
        ls -la out

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rashmusic-prod-release-signed
        path: out/*.apk

    - name: Publish GitHub Release (feeds the in-app updater)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VER="${{ steps.apks.outputs.version }}"
        gh release delete "v$VER" --cleanup-tag -y || true
        gh release create "v$VER" out/*.apk \
          --title "Rash Music v$VER" \
          --notes "$(git log -1 --pretty=%B)" \
          --latest
