<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="music" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#48B6FF"/>
      <stop offset="100%" stop-color="#8955F6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8955F6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8955F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gloss" cx="0.32" cy="0.2" r="0.85">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="150" cy="150" r="125"/></clipPath>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    /* Only transform / opacity / stroke-dashoffset are animated, so it stays on the GPU path. */
    .glow  { transform-origin: 150px 150px; animation: glow 0.9s cubic-bezier(.22,1,.36,1) both; }
    .disc  { transform-origin: 150px 150px; animation: pop 0.75s cubic-bezier(.22,1,.36,1) both; }
    .arc   { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 0.85s cubic-bezier(.22,1,.36,1) forwards; }
    .a1 { animation-delay: .25s } .a2 { animation-delay: .4s } .a3 { animation-delay: .55s }
    .sweep { transform: translateX(-260px) skewX(-20deg); animation: sweep 0.9s cubic-bezier(.22,1,.36,1) .8s forwards; }
    .word  { opacity: 0; animation: rise 0.7s cubic-bezier(.22,1,.36,1) 1.2s forwards; }
    @keyframes glow  { from { opacity: 0; transform: scale(.7) } to { opacity: 1; transform: scale(1) } }
    @keyframes pop   { from { opacity: 0; transform: scale(.8) } to { opacity: 1; transform: scale(1) } }
    @keyframes draw  { to { stroke-dashoffset: 0 } }
    @keyframes sweep { to { transform: translateX(300px) skewX(-20deg) } }
    @keyframes rise  { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: translateY(0) } }
  </style>
  <rect width="1000" height="300" fill="#050505"/>
  <circle class="glow" cx="150" cy="150" r="190" fill="url(#glow)"/>
  <circle class="disc" cx="150" cy="150" r="125" fill="url(#music)"/>
  <circle class="disc" cx="150" cy="150" r="125" fill="url(#gloss)"/>
  <g clip-path="url(#disc)"><rect class="sweep" x="0" y="0" width="120" height="300" fill="url(#sweep)"/></g>
  <g fill="none" stroke="#050505" stroke-width="17" stroke-linecap="round">
    <path class="arc a1" pathLength="1" d="M75 112 Q150 80 225 112"/>
    <path class="arc a2" pathLength="1" d="M85 150 Q150 125 215 150"/>
    <path class="arc a3" pathLength="1" d="M98 187 Q150 169 202 187"/>
  </g>
  <g class="word" font-family="'SF Pro Display', Inter, 'Segoe UI', Arial, sans-serif" font-size="105" font-weight="700">
    <text x="320" y="180" fill="#FFFFFF">Rash</text>
    <text x="590" y="180" fill="url(#music)">Music</text>
  </g>
</svg>
