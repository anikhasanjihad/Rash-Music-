name: Release APK

# Copy this file to .github/workflows/release.yml (GitHub web editor). Push a tag like v1.0.0 (or run this by hand) and a GitHub Release is created
# with the signed APKs attached. The app's built-in updater reads the *latest
# release* of this repo, so publishing a release is what makes the update popup
# appear on users' phones.
#
# APK names matter: the updater only takes assets that start with "RashMusic-"
# and prefers the universal one (no "_ABI" suffix).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v1.0.0 (must match versionName in build.gradle.kts)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Updates only install over the previous version when every release is signed with the same key. See README → Releasing."
            exit 1
          fi

      - name: Write signing config
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > rashmusic-release.jks
          {
            echo "storeFile=rashmusic-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties
          {
            echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
            echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}"
            echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}"
          } > local.properties

      - name: Build signed prod release (universal + per-ABI, incl. 32-bit)
        run: ./gradlew assembleProdRelease --no-daemon

      - name: Name the APKs for the in-app updater
        run: |
          mkdir -p dist
          V="${{ steps.ver.outputs.tag }}"
          for f in app/build/outputs/apk/prod/release/*.apk; do
            b=$(basename "$f")
            case "$b" in
              *universal*)     cp "$f" "dist/RashMusic-$V.apk" ;;
              *armeabi-v7a*)   cp "$f" "dist/RashMusic-${V}_armeabi-v7a.apk" ;;
              *arm64-v8a*)     cp "$f" "dist/RashMusic-${V}_arm64-v8a.apk" ;;
              *x86_64*)        cp "$f" "dist/RashMusic-${V}_x86_64.apk" ;;
            esac
          done
          ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Rash Music ${{ steps.ver.outputs.name }}
          generate_release_notes: true
          files: dist/*.apk
